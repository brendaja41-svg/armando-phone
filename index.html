<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iPhone de Armando</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #1a1a1a;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* Marco del iPhone */
        .iphone-frame {
            width: 380px;
            height: 780px;
            border-radius: 48px;
            box-shadow: 0 0 0 10px #2d2d2d, 0 20px 50px rgba(0, 0, 0, 0.8);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px 16px;
            /* Fondo de pantalla de la familia */
            background: linear-gradient(rgba(0,0,0,0.3), rgba(0,0,0,0.5)), 
                        url('img/ellos y mel.JPG') center/cover no-repeat;
            background-color: #000;
        }

        /* Barra de estado */
        .status-bar {
            display: flex;
            justify-content: space-between;
            color: #ffffff;
            font-size: 14px;
            font-weight: 600;
            padding: 0 8px;
            margin-top: 10px;
        }

        /* Rejilla de íconos */
        .app-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px 12px;
            margin-top: 30px;
        }

        .app-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: #ffffff;
        }

        .app-icon {
            width: 60px;
            height: 60px;
            border-radius: 14px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 28px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            transition: transform 0.1s;
        }

        .app-icon:active {
            transform: scale(0.9);
        }

        .app-label {
            font-size: 11px;
            margin-top: 6px;
            font-weight: 500;
            text-shadow: 0 1px 3px rgba(0,0,0,0.8);
        }

        /* Colores de íconos */
        .icon-fotos { background: #ffffff; }
        .icon-notas { background: #ffcc00; color: #000; }
        .icon-mensajes { background: #34c759; color: #fff; }
        .icon-llamadas { background: #30d158; color: #fff; }

        /* Dock translúcido */
        .dock {
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 30px;
            padding: 12px 16px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            margin-bottom: 8px;
        }

        /* Ajuste para móviles */
        @media (max-width: 420px) {
            body { background: #000; }
            .iphone-frame {
                width: 100vw;
                height: 100vh;
                border-radius: 0;
                box-shadow: none;
            }
        }
    </style>
</head>
<body>

    <div class="iphone-frame">
        <!-- Barra superior -->
        <div class="status-bar">
            <span>09:41</span>
            <span>LTE 🔋</span>
        </div>

        <!-- Aplicaciones principales -->
        <div class="app-grid">
            
            <!-- Fotos -->
            <a href="galerija/galerija.html" class="app-item">
                <div class="app-icon icon-fotos">🖼️</div>
                <span class="app-label">Fotos</span>
            </a>

            <!-- Notas -->
            <a href="beleske/beleske.html" class="app-item">
                <div class="app-icon icon-notas">📝</div>
                <span class="app-label">Notas</span>
            </a>

            <!-- Mensajes -->
            <a href="poruke/poruke.html" class="app-item">
                <div class="app-icon icon-mensajes">💬</div>
                <span class="app-label">Mensajes</span>
            </a>

            <!-- Llamadas -->
            <a href="poziv/poziv.html" class="app-item">
                <div class="app-icon icon-llamadas">📞</div>
                <span class="app-label">Teléfono</span>
            </a>

        </div>

        <div></div><!-- Espaciador -->

        <!-- Dock inferior -->
        <div class="dock">
            <a href="poruke/poruke.html" class="app-item">
                <div class="app-icon icon-mensajes">💬</div>
            </a>
            <a href="poziv/poziv.html" class="app-item">
                <div class="app-icon icon-llamadas">📞</div>
            </a>
            <a href="galerija/galerija.html" class="app-item">
                <div class="app-icon icon-fotos">🖼️</div>
            </a>
            <a href="beleske/beleske.html" class="app-item">
                <div class="app-icon icon-notas">📝</div>
            </a>
        </div>
    </div>

</body>
</html>
